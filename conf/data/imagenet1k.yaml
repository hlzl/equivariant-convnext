name: imagenet1k
root: ${oc.env:IMAGENET_ROOT,${oc.env:HOME}/Data/ImageNet1k}
image_size: 224
in_channels: 3
num_classes: 1000
batch_size: 256
workers: 16
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
interpolation: bicubic
crop_pct: 0.875
crop_scale: [0.08, 1.0]
crop_ratio: [0.75, 1.3333333333333333]
hflip: 0.5
color_jitter: 0.4
rand_aug: rand-m9-mstd0.5-inc1
random_erase: 0.25
erase_mode: pixel
rot_aug: none
