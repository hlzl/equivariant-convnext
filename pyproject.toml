[project]
name = "equivariant-convnext"
version = "0.1.0"
description = "Efficient exact C4-equivariant ConvNeXt research models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "escnn==1.0.11",
    "h5py>=3.16.0",
    "hydra-core>=1.3.2",
    "lie-learn @ git+https://github.com/AMLab-Amsterdam/lie_learn.git@edf012f5f60af320175d2e6269db78b984b5bfc3",
    "numpy>=2.2.3",
    "safetensors>=0.8.0",
    "timm==1.0.28",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.57.6",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.uv]
# REViT uses planar C4 kernels; the optional SO(3) Fortran backend is unused.
exclude-dependencies = ["py3nj"]
